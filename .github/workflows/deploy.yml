name: Deploy to EC2

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 18.233.166.181
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Install required packages
            sudo apt-get update
            sudo apt-get install -y python3 python3-pip

            # Clone and setup application
            cd ~/CitadelDNS || git clone https://github.com/juniorpayne/CitadelDNS.git ~/CitadelDNS
            cd ~/CitadelDNS
            git fetch origin
            git reset --hard origin/development
            pip3 install -r requirements.txt

            # Setup systemd service
            sudo cp citadel-dns.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable citadel-dns
            sudo systemctl restart citadel-dns
            sudo systemctl status citadel-dns